<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cashflow Tracker - Fast Track Edition</title>
    
    <!-- นำเข้า Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- นำเข้า FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- นำเข้า React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- นำเข้า Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Inter', system-ui, sans-serif; background-color: #f8fafc; }
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        /* เอฟเฟกต์สีทองสำหรับ Fast Track */
        .fast-track-gradient { background: linear-gradient(135deg, #1e1b4b 0%, #4c1d95 100%); }
        .gold-gradient { background: linear-gradient(to right, #fbbf24, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ==========================================
        // 1. Database: ฐานข้อมูลมาตรฐานของเกม
        // ==========================================
        const PROFESSIONS = [
            { id: 'janitor', name: 'ภารโรง (Janitor)', salary: 1600, savings: 600, expenses: { taxes: 300, home: 200, school: 0, car: 100, creditCard: 100, retail: 300, bank: 0, perChild: 100 }, liabilities: { home: 20000, school: 0, car: 4000, creditCard: 3000 } },
            { id: 'mechanic', name: 'ช่างเครื่อง (Mechanic)', salary: 2000, savings: 700, expenses: { taxes: 400, home: 300, school: 0, car: 100, creditCard: 100, retail: 400, bank: 0, perChild: 100 }, liabilities: { home: 31000, school: 0, car: 3000, creditCard: 3000 } },
            { id: 'truck_driver', name: 'คนขับรถบรรทุก (Truck Driver)', salary: 2500, savings: 800, expenses: { taxes: 500, home: 400, school: 0, car: 100, creditCard: 100, retail: 600, bank: 0, perChild: 200 }, liabilities: { home: 38000, school: 0, car: 4000, creditCard: 3000 } },
            { id: 'secretary', name: 'เลขาฯ (Secretary)', salary: 2500, savings: 700, expenses: { taxes: 500, home: 400, school: 0, car: 100, creditCard: 100, retail: 600, bank: 0, perChild: 100 }, liabilities: { home: 38000, school: 0, car: 4000, creditCard: 3000 } },
            { id: 'police', name: 'ตำรวจ (Police Officer)', salary: 3000, savings: 500, expenses: { taxes: 600, home: 400, school: 0, car: 100, creditCard: 100, retail: 700, bank: 0, perChild: 200 }, liabilities: { home: 46000, school: 0, car: 5000, creditCard: 3000 } },
            { id: 'nurse', name: 'พยาบาล (Nurse)', salary: 3100, savings: 500, expenses: { taxes: 600, home: 400, school: 100, car: 100, creditCard: 200, retail: 600, bank: 0, perChild: 200 }, liabilities: { home: 47000, school: 6000, car: 5000, creditCard: 4000 } },
            { id: 'teacher', name: 'ครู (Teacher)', salary: 3300, savings: 400, expenses: { taxes: 500, home: 500, school: 100, car: 100, creditCard: 200, retail: 700, bank: 0, perChild: 200 }, liabilities: { home: 50000, school: 12000, car: 5000, creditCard: 4000 } },
            { id: 'manager', name: 'ผู้จัดการ (Business MGR)', salary: 4600, savings: 400, expenses: { taxes: 900, home: 700, school: 100, car: 100, creditCard: 200, retail: 1000, bank: 0, perChild: 300 }, liabilities: { home: 75000, school: 12000, car: 6000, creditCard: 4000 } },
            { id: 'engineer', name: 'วิศวกร (Engineer)', salary: 4900, savings: 400, expenses: { taxes: 1000, home: 700, school: 100, car: 200, creditCard: 200, retail: 1000, bank: 0, perChild: 200 }, liabilities: { home: 75000, school: 12000, car: 7000, creditCard: 5000 } },
            { id: 'lawyer', name: 'ทนายความ (Lawyer)', salary: 7500, savings: 2000, expenses: { taxes: 1800, home: 1100, school: 300, car: 200, creditCard: 200, retail: 1500, bank: 0, perChild: 400 }, liabilities: { home: 115000, school: 78000, car: 11000, creditCard: 7000 } },
            { id: 'airline_pilot', name: 'นักบิน (Airline Pilot)', salary: 9500, savings: 2500, expenses: { taxes: 2000, home: 1000, school: 0, car: 300, creditCard: 700, retail: 2000, bank: 0, perChild: 400 }, liabilities: { home: 90000, school: 0, car: 15000, creditCard: 22000 } },
            { id: 'doctor', name: 'แพทย์ (Doctor)', salary: 13200, savings: 3500, expenses: { taxes: 3200, home: 1900, school: 700, car: 300, creditCard: 200, retail: 2000, bank: 0, perChild: 700 }, liabilities: { home: 202000, school: 150000, car: 19000, creditCard: 10000 } }
        ].sort((a, b) => a.salary - b.salary);

        const PAPER_ASSETS = ["ON2U", "MYT4U", "OK4U", "GRO4US", "ทองคำ"];
        const RE_ASSETS = ["บ้าน 2Br/1Ba", "บ้าน 3Br/2Ba", "คอนโด 2Br/1Ba", "Apartment 12 unit", "Apartment 24 unit", "Apartment 60 unit", "Duplex", "4-plex", "8-plex", "Pizza Franchise", "Limited Partner", "Automated Business", "Car wash"];

        const INITIAL_GAME_STATE = {
            profession: null, 
            cash: 0,
            children: 0,
            bankLoanAmount: 0, 
            assets: { stocks: [], realEstate: [] },
            liabilities: {},
            // ระบบ Fast Track (Phase 2)
            fastTrack: {
                isActive: false,
                baseIncome: 0, // กระแสเงินสดพื้นฐาน (50,000 + Passive จากเฟส 1)
                businesses: [], // ธุรกิจขนาดใหญ่บนลู่ทางด่วน
                dreamBought: false // สถานะการซื้อความฝัน
            }
        };

        // ==========================================
        // Utils & Smart Parsers
        // ==========================================
        const formatMoney = (amount) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 0 }).format(amount || 0);
        const generateId = () => Math.random().toString(36).substr(2, 9);
        
        const parseSmartInput = (inputStr, base) => {
            if (!inputStr) return NaN;
            let str = String(inputStr).trim();
            if (str === '') return NaN;

            if (str.startsWith('+') && str.endsWith('%')) {
                const pct = parseFloat(str.replace('+', '').replace('%', ''));
                return base + (base * (pct / 100));
            } else if (str.startsWith('-') && str.endsWith('%')) {
                 const pct = parseFloat(str.replace('-', '').replace('%', ''));
                return base - (base * (pct / 100));
            } else if (str.startsWith('+')) {
                const amt = parseFloat(str.replace('+', '').replace('$', ''));
                return base + amt;
            } else if (str.startsWith('-')) {
                const amt = parseFloat(str.replace('-', '').replace('$', ''));
                return base - amt;
            }
            return parseFloat(str); 
        };

        // ==========================================
        // 2. Main Application Component
        // ==========================================
        function App() {
            const [gameState, setGameState] = useState(() => {
                try {
                    const saved = localStorage.getItem('cashflow_v6_fasttrack');
                    return saved ? JSON.parse(saved) : INITIAL_GAME_STATE;
                } catch { return INITIAL_GAME_STATE; }
            });

            const [toastMsg, setToastMsg] = useState('');
            const [confirmDialog, setConfirmDialog] = useState(null); 
            const [actionModal, setActionModal] = useState(null); 
            const [modalInput, setModalInput] = useState({ amount: '', price: '', shares: '', desc: '' });

            useEffect(() => {
                localStorage.setItem('cashflow_v6_fasttrack', JSON.stringify(gameState));
            }, [gameState]);

            const showToast = (msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(''), 3000);
            };

            const openModal = (modalData) => {
                setActionModal(modalData);
                setModalInput({
                    amount: '',
                    price: '',
                    shares: modalData?.type === 'sell_stock' ? modalData.payload.shares : '',
                    desc: ''
                });
            };

            // --- คำนวณรายรับ รายจ่าย (Phase 1) ---
            const prof = gameState.profession;
            const hasProfession = prof !== null;

            const salary = prof ? prof.salary : 0;
            const p1PassiveIncome = gameState.assets.realEstate.reduce((sum, re) => sum + Number(re.cashflow), 0);
            const p1TotalIncome = salary + p1PassiveIncome;
            
            const taxes = prof ? prof.expenses.taxes : 0;
            const homeExp = gameState.liabilities.home > 0 ? prof.expenses.home : 0;
            const schoolExp = gameState.liabilities.school > 0 ? prof.expenses.school : 0;
            const carExp = gameState.liabilities.car > 0 ? prof.expenses.car : 0;
            const ccExp = gameState.liabilities.creditCard > 0 ? prof.expenses.creditCard : 0;
            const retailExp = prof ? prof.expenses.retail : 0; 
            const totalChildExp = gameState.children * (prof ? prof.expenses.perChild : 0);
            const bankLoanExp = (gameState.bankLoanAmount || 0) * 0.1; 

            const p1TotalExpenses = taxes + homeExp + schoolExp + carExp + ccExp + retailExp + totalChildExp + bankLoanExp;
            const p1MonthlyCashflow = p1TotalIncome - p1TotalExpenses;
            const isFastTrackReady = p1PassiveIncome >= p1TotalExpenses && p1TotalExpenses > 0 && !gameState.fastTrack.isActive;

            // --- คำนวณ (Phase 2 Fast Track) ---
            const ftBusinessIncome = gameState.fastTrack.businesses.reduce((sum, b) => sum + Number(b.cashflow), 0);
            const ftTotalIncome = gameState.fastTrack.baseIncome + ftBusinessIncome; // Cashflow Day Income
            const hasWonGame = gameState.fastTrack.isActive && (gameState.fastTrack.dreamBought || ftBusinessIncome >= 50000);

            // ==========================================
            // Event Handlers
            // ==========================================
            const handleSelectProfession = (profId) => {
                if(profId === '') return;
                const selected = PROFESSIONS.find(p => p.id === profId);
                setGameState(prev => ({
                    ...INITIAL_GAME_STATE, 
                    profession: selected,
                    cash: selected.savings,
                    liabilities: { ...selected.liabilities }
                }));
                showToast(`เริ่มเกมด้วยอาชีพ: ${selected.name}`);
            };

            const handleRandomProfession = () => {
                const randomProf = PROFESSIONS[Math.floor(Math.random() * PROFESSIONS.length)];
                handleSelectProfession(randomProf.id);
            };

            const handlePayday = () => {
                if (!hasProfession) return;
                if (gameState.fastTrack.isActive) {
                    setGameState(prev => ({ ...prev, cash: prev.cash + ftTotalIncome }));
                    showToast(`CASHFLOW DAY! รับเงินก้อนใหญ่: ${formatMoney(ftTotalIncome)}`);
                } else {
                    setGameState(prev => ({ ...prev, cash: prev.cash + p1MonthlyCashflow }));
                    showToast(`รับ Payday สำเร็จ: ${formatMoney(p1MonthlyCashflow)}`);
                }
            };

            // ---- โค้ดจัดการยิบย่อยของ Phase 1 (ซ่อนโค้ดบางส่วนที่ซ้ำเพื่อให้สะอาด) ----
            const executeOneOffTransaction = (e) => {
                e.preventDefault();
                const type = actionModal.payload;
                const amount = Number(modalInput.amount);
                const desc = modalInput.desc || 'รายการจิปาถะ';
                setGameState(prev => ({ ...prev, cash: type === 'income' ? prev.cash + amount : prev.cash - amount }));
                setActionModal(null);
                showToast(`${type === 'income' ? 'รับเงิน' : 'จ่ายเงิน'}: ${formatMoney(amount)}`);
            };

            const executePayDebt = (e) => {
                e.preventDefault();
                const { debtType, currentDebt } = actionModal.payload;
                setGameState(prev => ({
                    ...prev, cash: prev.cash - currentDebt, liabilities: { ...prev.liabilities, [debtType]: 0 }
                }));
                setActionModal(null);
                showToast(`ปิดหนี้สำเร็จ!`);
            };

            // ---- โค้ด Phase 2 Fast Track ----
            const handleEnterFastTrack = () => {
                const initialFTCash = p1PassiveIncome * 100;
                setGameState(prev => ({
                    ...prev,
                    cash: prev.cash + initialFTCash,
                    fastTrack: {
                        isActive: true,
                        baseIncome: 50000 + p1PassiveIncome,
                        businesses: [],
                        dreamBought: false
                    }
                }));
                window.scrollTo(0,0);
                showToast(`ยินดีต้อนรับสู่ลู่ทางด่วน! รับเงินก้อนแรก ${formatMoney(initialFTCash)}`);
            };

            const handleBuyFTBusiness = (e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                const name = fd.get('name');
                const cost = Number(fd.get('cost'));
                const cashflow = Number(fd.get('cashflow'));
                
                if(!name || cost <= 0) return;
                if(cost > gameState.cash) return alert("เงินสดไม่พอซื้อธุรกิจนี้บน Fast Track!");
                
                setGameState(prev => ({
                    ...prev,
                    cash: prev.cash - cost,
                    fastTrack: {
                        ...prev.fastTrack,
                        businesses: [...prev.fastTrack.businesses, { id: generateId(), name, cost, cashflow }]
                    }
                }));
                setActionModal(null);
                showToast(`ซื้อธุรกิจใหญ่: ${name} เรียบร้อย (Cashflow +${formatMoney(cashflow)})`);
            };

            const handleBuyDream = () => {
                // กติกา: ซื้อความฝัน ราคาตามช่องตก
                const costStr = prompt("ยินดีด้วยที่คุณตกช่องความฝัน!\nกรุณาระบุราคาสิ่งที่คุณต้องการซื้อ (เช่น 50000):");
                if(!costStr) return;
                const cost = Number(costStr);
                if(isNaN(cost) || cost <= 0) return alert("ตัวเลขไม่ถูกต้อง");
                if(cost > gameState.cash) return alert("เงินสดบน Fast Track ไม่พอซื้อความฝันนี้!");

                setGameState(prev => ({
                    ...prev,
                    cash: prev.cash - cost,
                    fastTrack: { ...prev.fastTrack, dreamBought: true }
                }));
            };

            // ==========================================
            // 3. UI Modals
            // ==========================================
            const renderActionModal = () => {
                if (!actionModal) return null;
                const { type, payload } = actionModal;

                return (
                    <div className="fixed inset-0 bg-slate-900/80 z-50 flex items-center justify-center p-4 fade-in">
                        <div className="bg-white rounded-xl shadow-2xl max-w-md w-full overflow-hidden">
                            <div className="bg-slate-800 text-white px-6 py-4 flex justify-between items-center">
                                <h3 className="text-lg font-bold">
                                    {type === 'pay_debt' && '💸 จ่ายปลดหนี้ (ตามกติกาหลัก)'}
                                    {type === 'one_off_tx' && (payload === 'income' ? '💰 รับเงินพิเศษ' : '💳 จ่ายเงินพิเศษ')}
                                    {type === 'ft_buy_biz' && '🏢 ซื้อธุรกิจลู่ทางด่วน (Fast Track)'}
                                </h3>
                                <button onClick={() => setActionModal(null)} className="text-slate-300 hover:text-white"><i className="fas fa-times"></i></button>
                            </div>
                            <div className="p-6">
                                
                                {type === 'one_off_tx' && (
                                    <form onSubmit={executeOneOffTransaction}>
                                        <div className="mb-4">
                                            <label className="block text-sm font-bold text-slate-700 mb-1">คำอธิบาย</label>
                                            <input type="text" value={modalInput.desc} onChange={e => setModalInput({...modalInput, desc: e.target.value})} placeholder="เช่น จ่ายค่าซ่อมรถ / รับเงินคืน" className="w-full border rounded p-2" />
                                        </div>
                                        <div className="mb-6">
                                            <label className="block text-sm font-bold text-slate-700 mb-1">จำนวนเงิน</label>
                                            <input type="number" min="1" value={modalInput.amount} onChange={e => setModalInput({...modalInput, amount: e.target.value})} className="w-full border rounded p-2 text-lg" required />
                                        </div>
                                        <button type="submit" className={`w-full text-white font-bold py-2 rounded shadow ${payload === 'income' ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-red-600 hover:bg-red-700'}`}>
                                            ยืนยัน
                                        </button>
                                    </form>
                                )}

                                {type === 'pay_debt' && (() => {
                                    const canAfford = gameState.cash >= payload.currentDebt;
                                    return (
                                        <form onSubmit={executePayDebt}>
                                            <div className="mb-4 bg-orange-50 p-4 rounded-lg text-sm border border-orange-200 text-center">
                                                <div className="text-slate-600 mb-1">ต้องการปิดหนี้</div>
                                                <div className="text-lg font-bold text-slate-800 mb-2">{payload.label}</div>
                                                <div className="text-3xl font-black text-orange-700 mb-4">{formatMoney(payload.currentDebt)}</div>
                                            </div>
                                            
                                            <div className={`mb-6 p-3 rounded text-sm text-center border ${canAfford ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 'bg-red-50 border-red-200 text-red-800'}`}>
                                                เงินสดปัจจุบันของคุณ: <strong>{formatMoney(gameState.cash)}</strong>
                                                {!canAfford && <div className="font-bold mt-1 text-red-600"><i className="fas fa-ban"></i> เงินสดไม่พอจ่ายก้อนนี้!</div>}
                                            </div>

                                            <button type="submit" disabled={!canAfford} className={`w-full text-white font-bold py-3 rounded shadow transition-colors ${canAfford ? 'bg-orange-600 hover:bg-orange-700 cursor-pointer' : 'bg-slate-400 cursor-not-allowed opacity-70'}`}>
                                                {canAfford ? 'จ่ายปิดหนี้ก้อนนี้เต็มจำนวน' : 'เงินสดไม่พอจ่าย'}
                                            </button>
                                        </form>
                                    );
                                })()}

                                {type === 'ft_buy_biz' && (
                                    <form onSubmit={handleBuyFTBusiness}>
                                        <div className="mb-4 bg-purple-50 p-3 rounded text-sm border border-purple-200 text-purple-900">
                                            การซื้อธุรกิจบน Fast Track ซื้อด้วยเงินสดก้อนเดียว ไม่มีหนี้จำนอง
                                        </div>
                                        <div className="mb-3">
                                            <label className="block text-sm font-bold text-slate-700 mb-1">ชื่อธุรกิจ</label>
                                            <input type="text" name="name" className="w-full border rounded p-2" required placeholder="เช่น ร้านแฟรนไชส์ไอศกรีม" />
                                        </div>
                                        <div className="mb-3">
                                            <label className="block text-sm font-bold text-slate-700 mb-1">ราคาซื้อ (Cost)</label>
                                            <input type="number" name="cost" min="1" className="w-full border rounded p-2" required />
                                        </div>
                                        <div className="mb-6">
                                            <label className="block text-sm font-bold text-slate-700 mb-1">Cashflow ที่ได้ต่อเดือน</label>
                                            <input type="number" name="cashflow" min="1" className="w-full border rounded p-2 text-lg text-emerald-700 font-bold" required />
                                        </div>
                                        <button type="submit" className="w-full bg-purple-700 hover:bg-purple-800 text-white font-bold py-3 rounded shadow">
                                            ยืนยันการซื้อธุรกิจ
                                        </button>
                                    </form>
                                )}

                            </div>
                        </div>
                    </div>
                );
            };

            // ==========================================
            // 4. UI Render 
            // ==========================================
            return (
                <div className="min-h-screen pb-20 text-slate-800">
                    
                    {toastMsg && (
                        <div className="fixed top-4 right-4 bg-slate-800 text-white px-4 py-3 rounded-lg shadow-xl z-[60] flex items-center gap-2 fade-in border-l-4 border-emerald-500">
                            <i className="fas fa-check-circle text-emerald-400"></i> {toastMsg}
                        </div>
                    )}

                    {confirmDialog && (
                        <div className="fixed inset-0 bg-slate-900/80 z-[60] flex items-center justify-center p-4 fade-in">
                            <div className="bg-white rounded-xl shadow-xl max-w-sm w-full p-6 text-center">
                                <h3 className="text-xl font-bold mb-2">{confirmDialog.title}</h3>
                                <p className="text-slate-600 mb-6">{confirmDialog.message}</p>
                                <div className="flex justify-center gap-3">
                                    <button onClick={() => setConfirmDialog(null)} className="px-4 py-2 bg-slate-200 font-bold rounded">ยกเลิก</button>
                                    <button onClick={() => { confirmDialog.onConfirm(); setConfirmDialog(null); }} className="px-4 py-2 bg-red-600 text-white font-bold rounded">ยืนยัน</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {renderActionModal()}

                    {/* HEADER (Dynamic ระหว่าง Phase 1 / Phase 2) */}
                    <header className={`sticky top-0 z-40 shadow-lg border-b-4 ${gameState.fastTrack.isActive ? 'fast-track-gradient border-purple-500 text-white' : 'bg-emerald-900 border-emerald-700 text-white'}`}>
                        <div className="max-w-6xl mx-auto px-4 py-3">
                            <div className="flex justify-between items-center mb-3">
                                <h1 className="text-xl font-bold flex items-center gap-2">
                                    {gameState.fastTrack.isActive ? <i className="fas fa-rocket text-purple-300"></i> : <i className="fas fa-money-bill-wave text-emerald-400"></i>}
                                    {gameState.fastTrack.isActive ? 'Cashflow : Fast Track' : 'Cashflow : Rat Race'}
                                </h1>
                                <button onClick={() => setConfirmDialog({title: 'เริ่มเกมใหม่?', message: 'ล้างข้อมูลทั้งหมด?', onConfirm: () => setGameState(INITIAL_GAME_STATE)})} className="text-sm bg-black/20 hover:bg-red-700 px-3 py-1.5 rounded transition-colors">
                                    เริ่มเกมใหม่
                                </button>
                            </div>

                            <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
                                <div className="bg-white/10 p-2 rounded relative">
                                    <div className="text-white/70 text-xs mb-1 flex justify-between items-center">
                                        <span>เงินสด (Cash)</span>
                                        <div className="flex gap-1">
                                            <button onClick={() => openModal({type: 'one_off_tx', payload: 'income'})} className="bg-white/20 hover:bg-white/40 px-1.5 rounded text-[10px]"><i className="fas fa-plus"></i></button>
                                            <button onClick={() => openModal({type: 'one_off_tx', payload: 'expense'})} className="bg-white/20 hover:bg-red-500 px-1.5 rounded text-[10px]"><i className="fas fa-minus"></i></button>
                                        </div>
                                    </div>
                                    <div className="text-xl font-bold">{formatMoney(gameState.cash)}</div>
                                </div>
                                
                                {gameState.fastTrack.isActive ? (
                                    <>
                                        <div className="bg-white/10 p-2 rounded">
                                            <div className="text-purple-200 text-xs mb-1">กระแสเงินสดเดิม (Base Day Pay)</div>
                                            <div className="text-xl font-bold">{formatMoney(gameState.fastTrack.baseIncome)}</div>
                                        </div>
                                        <div className="bg-white/10 p-2 rounded border border-purple-400/30">
                                            <div className="text-emerald-300 text-xs mb-1 font-bold">รายได้ธุรกิจใหม่ (เป้า: $50,000)</div>
                                            <div className="text-xl font-bold text-emerald-400">+{formatMoney(ftBusinessIncome)}</div>
                                        </div>
                                    </>
                                ) : (
                                    <>
                                        <div className="bg-white/10 p-2 rounded">
                                            <div className="text-emerald-200 text-xs mb-1">รายรับรวม (Total Income)</div>
                                            <div className="text-xl font-bold">{formatMoney(p1TotalIncome)}</div>
                                        </div>
                                        <div className="bg-white/10 p-2 rounded">
                                            <div className="text-emerald-200 text-xs mb-1">รายจ่ายรวม (Total Expenses)</div>
                                            <div className="text-xl font-bold text-red-300">{formatMoney(p1TotalExpenses)}</div>
                                        </div>
                                    </>
                                )}

                                <button onClick={handlePayday} disabled={!hasProfession} className={`p-2 rounded font-bold text-lg flex flex-col items-center justify-center transition-all shadow-md ${hasProfession ? 'bg-gradient-to-b from-yellow-400 to-amber-500 text-emerald-950 hover:scale-[1.02]' : 'bg-slate-700 text-slate-400 opacity-50'}`}>
                                    <span className="flex items-center gap-1">
                                        {gameState.fastTrack.isActive ? <><i className="fas fa-forward-fast"></i> CASHFLOW DAY!</> : <><i className="fas fa-sack-dollar"></i> Payday!</>}
                                    </span>
                                    <span className="text-xs bg-black/10 px-2 rounded-full mt-1">
                                        +{formatMoney(gameState.fastTrack.isActive ? ftTotalIncome : p1MonthlyCashflow)}
                                    </span>
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto px-4 py-6">
                        
                        {/* ---------------- GAME OVER / VICTORY ---------------- */}
                        {hasWonGame && (
                            <div className="bg-gradient-to-br from-yellow-300 via-yellow-400 to-amber-500 p-10 rounded-2xl shadow-2xl mb-8 text-amber-950 text-center fade-in border-4 border-yellow-200">
                                <i className="fas fa-crown text-7xl mb-4 text-white drop-shadow-md"></i>
                                <h1 className="text-4xl font-black mb-2 uppercase tracking-widest">Victory! ชนะเกมแล้ว!</h1>
                                <p className="text-xl font-bold opacity-90 mb-6">
                                    {gameState.fastTrack.dreamBought 
                                        ? "คุณบรรลุเป้าหมายสูงสุด ซื้อความฝันของคุณสำเร็จแล้ว 🎉"
                                        : `คุณสร้าง Cashflow บนลู่ทางด่วนทะลุ $50,000 ต่อเดือนสำเร็จแล้ว (${formatMoney(ftBusinessIncome)}) 🎉`}
                                </p>
                                <button onClick={() => window.location.reload()} className="bg-white text-amber-600 px-8 py-3 rounded-full font-black text-lg shadow hover:bg-slate-50 transition-colors">เล่นรอบใหม่</button>
                            </div>
                        )}

                        {/* ---------------- PRE-GAME ---------------- */}
                        {!hasProfession && (
                            <div className="bg-white p-8 rounded-xl shadow border border-slate-200 text-center max-w-2xl mx-auto mt-10 fade-in">
                                <h2 className="text-2xl font-bold text-slate-800 mb-2">เริ่มเกมสนามแข่งหนู (Phase 1)</h2>
                                <p className="text-slate-500 mb-6">เลือกอาชีพที่คุณจับได้จากการ์ด</p>
                                <div className="flex flex-col sm:flex-row justify-center gap-4">
                                    <select onChange={(e) => handleSelectProfession(e.target.value)} className="flex-1 p-3 border rounded-lg bg-slate-50 font-bold" defaultValue="">
                                        <option value="" disabled>-- เลือกอาชีพ (เรียงตามเงินเดือน) --</option>
                                        {PROFESSIONS.map(p => (
                                            <option key={p.id} value={p.id}>{p.name} (ด. {formatMoney(p.salary)})</option>
                                        ))}
                                    </select>
                                    <button onClick={handleRandomProfession} className="bg-slate-800 text-white p-3 rounded-lg font-bold"><i className="fas fa-dice"></i> สุ่มอาชีพ</button>
                                </div>
                            </div>
                        )}

                        {/* ---------------- FAST TRACK TRANSITION ---------------- */}
                        {isFastTrackReady && !hasWonGame && (
                            <div className="bg-gradient-to-r from-fuchsia-600 to-purple-700 p-8 rounded-2xl shadow-xl mb-8 text-white flex flex-col md:flex-row items-center justify-between border-4 border-fuchsia-400 fade-in relative overflow-hidden">
                                <div className="relative z-10 text-center md:text-left mb-4 md:mb-0">
                                    <h2 className="text-3xl font-black mb-2">🎉 Passive Income ชนะรายจ่ายแล้ว!</h2>
                                    <p className="text-lg opacity-90">คุณพร้อมออกจากสนามแข่งหนู เข้าสู่ลู่ทางด่วน (Fast Track)</p>
                                </div>
                                <button onClick={handleEnterFastTrack} className="relative z-10 bg-white text-purple-700 font-black text-xl px-8 py-4 rounded-xl shadow-lg hover:scale-105 transition-transform">
                                    เข้าสู่ Fast Track <i className="fas fa-rocket ml-2"></i>
                                </button>
                            </div>
                        )}

                        {/* ========================================================
                            PHASE 2: FAST TRACK UI
                        ======================================================== */}
                        {gameState.fastTrack.isActive && !hasWonGame && (
                            <div className="grid lg:grid-cols-2 gap-6 fade-in">
                                
                                <div className="space-y-6">
                                    <div className="bg-white rounded-xl shadow-md border-2 border-purple-200 overflow-hidden">
                                        <div className="bg-purple-100 px-4 py-3 font-black text-purple-900 border-b border-purple-200 text-lg flex items-center gap-2">
                                            <i className="fas fa-chart-line"></i> รายรับบนลู่ทางด่วน (Income)
                                        </div>
                                        <div className="p-6">
                                            <div className="flex justify-between items-center bg-slate-50 p-4 rounded-lg border mb-4">
                                                <span className="font-bold text-slate-600">กระแสเงินสดพื้นฐาน (Base Day Pay)</span>
                                                <span className="text-2xl font-black text-slate-800">{formatMoney(gameState.fastTrack.baseIncome)}</span>
                                            </div>
                                            <div className="flex justify-between items-center bg-emerald-50 p-4 rounded-lg border border-emerald-200">
                                                <div>
                                                    <span className="font-bold text-emerald-800 block">รายได้ธุรกิจใหม่บน Fast Track</span>
                                                    <span className="text-xs text-emerald-600">เป้าหมาย: สร้างกระแสเงินสดตรงนี้ให้ถึง $50,000</span>
                                                </div>
                                                <span className="text-3xl font-black text-emerald-600">+{formatMoney(ftBusinessIncome)}</span>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="bg-white rounded-xl shadow-md border-2 border-red-200 overflow-hidden p-6 text-center">
                                        <h3 className="font-bold text-slate-700 mb-2">บทลงโทษ (Penalties)</h3>
                                        <p className="text-xs text-slate-500 mb-4">หย่าร้าง (เสียเงินสดครึ่งหนึ่ง) หรือ โดนฟ้อง (เสียเงินสดครึ่งหนึ่ง)</p>
                                        <button onClick={() => setGameState(prev => ({...prev, cash: Math.floor(prev.cash / 2)}))} className="bg-red-100 hover:bg-red-200 text-red-700 font-bold py-2 px-6 rounded-full border border-red-300">
                                            <i className="fas fa-gavel"></i> หักเงินสดครึ่งหนึ่ง! (จ่ายค่าปรับ)
                                        </button>
                                    </div>
                                </div>

                                <div className="space-y-6">
                                    <div className="bg-white rounded-xl shadow-md border-2 border-amber-200 overflow-hidden">
                                        <div className="bg-amber-100 px-4 py-3 font-black text-amber-900 border-b border-amber-200 text-lg flex justify-between items-center">
                                            <span><i className="fas fa-building"></i> ธุรกิจ (Businesses)</span>
                                            <button onClick={() => openModal({type: 'ft_buy_biz'})} className="bg-amber-500 text-white px-3 py-1 text-sm rounded shadow hover:bg-amber-600">
                                                <i className="fas fa-plus"></i> ซื้อธุรกิจ
                                            </button>
                                        </div>
                                        <div className="p-4">
                                            {gameState.fastTrack.businesses.length === 0 ? (
                                                <div className="text-center py-8 text-slate-400 font-medium">ยังไม่ได้ซื้อธุรกิจใดๆ บนลู่ทางด่วน</div>
                                            ) : (
                                                <ul className="space-y-3">
                                                    {gameState.fastTrack.businesses.map(b => (
                                                        <li key={b.id} className="bg-slate-50 border border-slate-200 p-4 rounded-lg flex justify-between items-center">
                                                            <div>
                                                                <div className="font-bold text-slate-800">{b.name}</div>
                                                                <div className="text-xs text-slate-500">ซื้อมา: {formatMoney(b.cost)}</div>
                                                            </div>
                                                            <div className="font-black text-emerald-600 text-lg">+{formatMoney(b.cashflow)}</div>
                                                        </li>
                                                    ))}
                                                </ul>
                                            )}
                                        </div>
                                    </div>

                                    <div className="bg-gradient-to-br from-pink-50 to-rose-100 rounded-xl shadow-md border-2 border-rose-200 p-6 text-center">
                                        <i className="fas fa-star text-4xl text-rose-400 mb-3"></i>
                                        <h3 className="font-black text-xl text-rose-900 mb-2">เป้าหมายความฝัน (Your Dream)</h3>
                                        <p className="text-sm text-rose-700 mb-4">หากตกช่องความฝันที่เลือกไว้ คุณสามารถจ่ายเงินเพื่อซื้อมันและชนะเกมได้ทันที!</p>
                                        <button onClick={handleBuyDream} className="bg-rose-500 hover:bg-rose-600 text-white font-black py-3 px-8 rounded-full shadow-lg hover:scale-105 transition-transform">
                                            <i className="fas fa-gift"></i> ซื้อความฝัน (ชนะเกม)
                                        </button>
                                    </div>
                                </div>

                            </div>
                        )}

                        {/* ========================================================
                            PHASE 1: RAT RACE UI (ซ่อนเมื่ออยู่บน Fast Track)
                        ======================================================== */}
                        {hasProfession && !gameState.fastTrack.isActive && (
                            <div className="grid lg:grid-cols-12 gap-6 fade-in opacity-50 pointer-events-none">
                                {/* หมายเหตุ: ผมจงใจทำ UI ให้มองเห็นลางๆ เพื่อให้รับรู้ว่าข้อมูลเก่าโดนแช่แข็ง (Frozen) แล้ว */}
                                <div className="lg:col-span-12 bg-slate-800 text-white p-4 rounded-xl text-center font-bold text-xl">
                                    <i className="fas fa-lock"></i> ข้อมูลสนามแข่งหนูถูกแช่แข็งแล้ว คุณอยู่บนลู่ทางด่วน!
                                </div>
                            </div>
                        )}

                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
