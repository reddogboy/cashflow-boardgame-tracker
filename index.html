<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cashflow Tracker - Pro Edition</title>
    
    <!-- นำเข้า Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- นำเข้า FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- นำเข้า React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- นำเข้า Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Inter', system-ui, sans-serif; background-color: #f8fafc; }
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .fade-in { animation: fadeIn 0.2s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        .fast-track-gradient { background: linear-gradient(135deg, #1e1b4b 0%, #4c1d95 100%); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ==========================================
        // 1. Database & Initial State
        // ==========================================
        const PROFESSIONS = [
            { id: 'janitor', name: 'ภารโรง (Janitor)', salary: 1600, savings: 600, expenses: { taxes: 300, home: 200, school: 0, car: 100, creditCard: 100, retail: 300, bank: 0, perChild: 100 }, liabilities: { home: 20000, school: 0, car: 4000, creditCard: 3000 } },
            { id: 'mechanic', name: 'ช่างเครื่อง (Mechanic)', salary: 2000, savings: 700, expenses: { taxes: 400, home: 300, school: 0, car: 100, creditCard: 100, retail: 400, bank: 0, perChild: 100 }, liabilities: { home: 31000, school: 0, car: 3000, creditCard: 3000 } },
            { id: 'truck_driver', name: 'คนขับรถบรรทุก (Truck Driver)', salary: 2500, savings: 800, expenses: { taxes: 500, home: 400, school: 0, car: 100, creditCard: 100, retail: 600, bank: 0, perChild: 200 }, liabilities: { home: 38000, school: 0, car: 4000, creditCard: 3000 } },
            { id: 'secretary', name: 'เลขาฯ (Secretary)', salary: 2500, savings: 700, expenses: { taxes: 500, home: 400, school: 0, car: 100, creditCard: 100, retail: 600, bank: 0, perChild: 100 }, liabilities: { home: 38000, school: 0, car: 4000, creditCard: 3000 } },
            { id: 'police', name: 'ตำรวจ (Police Officer)', salary: 3000, savings: 500, expenses: { taxes: 600, home: 400, school: 0, car: 100, creditCard: 100, retail: 700, bank: 0, perChild: 200 }, liabilities: { home: 46000, school: 0, car: 5000, creditCard: 3000 } },
            { id: 'nurse', name: 'พยาบาล (Nurse)', salary: 3100, savings: 500, expenses: { taxes: 600, home: 400, school: 100, car: 100, creditCard: 200, retail: 600, bank: 0, perChild: 200 }, liabilities: { home: 47000, school: 6000, car: 5000, creditCard: 4000 } },
            { id: 'teacher', name: 'ครู (Teacher)', salary: 3300, savings: 400, expenses: { taxes: 500, home: 500, school: 100, car: 100, creditCard: 200, retail: 700, bank: 0, perChild: 200 }, liabilities: { home: 50000, school: 12000, car: 5000, creditCard: 4000 } },
            { id: 'manager', name: 'ผู้จัดการ (Business MGR)', salary: 4600, savings: 400, expenses: { taxes: 900, home: 700, school: 100, car: 100, creditCard: 200, retail: 1000, bank: 0, perChild: 300 }, liabilities: { home: 75000, school: 12000, car: 6000, creditCard: 4000 } },
            { id: 'engineer', name: 'วิศวกร (Engineer)', salary: 4900, savings: 400, expenses: { taxes: 1000, home: 700, school: 100, car: 200, creditCard: 200, retail: 1000, bank: 0, perChild: 200 }, liabilities: { home: 75000, school: 12000, car: 7000, creditCard: 5000 } },
            { id: 'lawyer', name: 'ทนายความ (Lawyer)', salary: 7500, savings: 2000, expenses: { taxes: 1800, home: 1100, school: 300, car: 200, creditCard: 200, retail: 1500, bank: 0, perChild: 400 }, liabilities: { home: 115000, school: 78000, car: 11000, creditCard: 7000 } },
            { id: 'airline_pilot', name: 'นักบิน (Airline Pilot)', salary: 9500, savings: 2500, expenses: { taxes: 2000, home: 1000, school: 0, car: 300, creditCard: 700, retail: 2000, bank: 0, perChild: 400 }, liabilities: { home: 90000, school: 0, car: 15000, creditCard: 22000 } },
            { id: 'doctor', name: 'แพทย์ (Doctor)', salary: 13200, savings: 3500, expenses: { taxes: 3200, home: 1900, school: 700, car: 300, creditCard: 200, retail: 2000, bank: 0, perChild: 700 }, liabilities: { home: 202000, school: 150000, car: 19000, creditCard: 10000 } }
        ].sort((a, b) => a.salary - b.salary);

        const PAPER_ASSETS = ["ON2U", "MYT4U", "OK4U", "GRO4US", "ทองคำ"];
        const RE_ASSETS = ["บ้าน 2Br/1Ba", "บ้าน 3Br/2Ba", "คอนโด 2Br/1Ba", "Apartment 12 unit", "Apartment 24 unit", "Apartment 60 unit", "Duplex", "4-plex", "8-plex", "Pizza Franchise", "Limited Partner", "Automated Business", "Car wash"];

        const INITIAL_GAME_STATE = {
            profession: null, 
            cash: 0,
            children: 0,
            bankLoanAmount: 0, 
            mlmCount: 0,
            assets: { stocks: [], realEstate: [] },
            liabilities: {}, 
            history: [],
            fastTrack: { isActive: false, baseIncome: 0, businesses: [] } // ตัดความฝันออกตามกติกาใหม่
        };

        // ==========================================
        // Utils & Helpers
        // ==========================================
        const formatMoney = (amount) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 0 }).format(amount || 0);
        const generateId = () => Math.random().toString(36).substr(2, 9);
        
        const parseSmartInput = (inputStr, base) => {
            if (!inputStr) return NaN;
            let str = String(inputStr).trim().replace(/,/g, ''); 
            if (str === '') return NaN;
            if (str.startsWith('+') && str.endsWith('%')) {
                const pct = parseFloat(str.replace('+', '').replace('%', ''));
                return base + (base * (pct / 100));
            } else if (str.startsWith('-') && str.endsWith('%')) {
                 const pct = parseFloat(str.replace('-', '').replace('%', ''));
                return base - (base * (pct / 100));
            } else if (str.startsWith('+')) {
                const amt = parseFloat(str.replace('+', '').replace('$', ''));
                return base + amt;
            } else if (str.startsWith('-')) {
                const amt = parseFloat(str.replace('-', '').replace('$', ''));
                return base - amt;
            }
            return parseFloat(str); 
        };

        // ==========================================
        // UI Component: NumberInput (ระบบใส่ลูกน้ำ)
        // ==========================================
        const NumberInput = ({ value, onChange, placeholder, className, required }) => {
            const displayValue = (value === '' || value === '-' || value === null || value === undefined) 
                ? (value || '') 
                : Number(value).toLocaleString('en-US');
            
            const handleChange = (e) => {
                let raw = e.target.value.replace(/,/g, ''); 
                if (raw === '' || raw === '-') {
                    onChange(raw);
                } else if (!isNaN(raw)) {
                    onChange(Number(raw));
                }
            };
            
            return (
                <input 
                    type="text" 
                    inputMode="numeric" 
                    value={displayValue} 
                    onChange={handleChange} 
                    placeholder={placeholder} 
                    className={className} 
                    required={required} 
                />
            );
        };

        // ==========================================
        // 2. Main Application Component
        // ==========================================
        function App() {
            // ระบบ Initial State ป้องกัน State พัง (Defensive Initialization)
            const [gameState, setGameState] = useState(() => {
                try {
                    const saved = localStorage.getItem('cashflow_v8_stable'); // เปลี่ยน Key เพื่อล้างไพ่ใหม่
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        // ประกอบร่างข้อมูลใหม่ให้ชัวร์ว่าโครงสร้างครบถ้วน 100%
                        return {
                            ...INITIAL_GAME_STATE,
                            ...parsed,
                            assets: { ...INITIAL_GAME_STATE.assets, ...(parsed.assets || {}) },
                            liabilities: { ...INITIAL_GAME_STATE.liabilities, ...(parsed.liabilities || {}) },
                            fastTrack: { ...INITIAL_GAME_STATE.fastTrack, ...(parsed.fastTrack || {}) },
                            history: parsed.history || []
                        };
                    }
                } catch (e) {
                    console.error("State parsing error:", e);
                }
                return INITIAL_GAME_STATE;
            });

            const [toastMsg, setToastMsg] = useState('');
            const [confirmDialog, setConfirmDialog] = useState(null); 
            const [actionModal, setActionModal] = useState(null); 
            const [autoLoanPrompt, setAutoLoanPrompt] = useState(null);
            const [bankruptcyMode, setBankruptcyMode] = useState(false); 
            
            const [stockInput, setStockInput] = useState({ symbol: PAPER_ASSETS[0], shares: '', costPerShare: '' });
            const [reInput, setReInput] = useState({ name: RE_ASSETS[0], downPayment: '', cost: '', cashflow: '' });
            const [sellInput, setSellInput] = useState({ price: '', units: '' }); 
            const [manualTx, setManualTx] = useState({ desc: '', amount: '', cashflow: '' }); 
            const [customBankLoan, setCustomBankLoan] = useState(''); 

            useEffect(() => {
                localStorage.setItem('cashflow_v8_stable', JSON.stringify(gameState));
            }, [gameState]);

            const showToast = (msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(''), 3000);
            };

            const addHistory = (desc, amount, type) => {
                setGameState(prev => {
                    const newLog = { id: generateId(), time: new Date().toLocaleTimeString('th-TH', {hour: '2-digit', minute:'2-digit'}), desc, amount, type };
                    return { ...prev, history: [newLog, ...prev.history].slice(0, 100) };
                });
            };

            const openModal = (modalData) => {
                setActionModal(modalData);
                setSellInput({ price: '', units: modalData?.payload?.shares || 1 }); 
                setManualTx({ desc: '', amount: '', cashflow: '' });
            };

            const resetGame = () => {
                setConfirmDialog({
                    title: 'เริ่มเกมใหม่?',
                    message: 'ข้อมูลทั้งหมดจะถูกลบถาวร ยืนยันหรือไม่?',
                    onConfirm: () => {
                        localStorage.removeItem('cashflow_v8_stable');
                        setGameState(INITIAL_GAME_STATE);
                        setBankruptcyMode(false);
                        setConfirmDialog(null); // แก้บั๊กหน้าต่างค้าง
                        showToast('รีเซ็ตเกมเรียบร้อย');
                    }
                });
            };

            const executeWithAutoLoan = (cost, txDesc, stateUpdaterCallback) => {
                if (gameState.cash >= cost) {
                    stateUpdaterCallback(0); 
                } else {
                    const shortfall = cost - gameState.cash;
                    const loanNeeded = Math.ceil(shortfall / 1000) * 1000; 
                    setAutoLoanPrompt({
                        txDesc, cost, loanNeeded,
                        onConfirm: () => {
                            stateUpdaterCallback(loanNeeded);
                            setAutoLoanPrompt(null);
                        },
                        onCancel: () => {
                            setAutoLoanPrompt(null);
                        }
                    });
                }
            };

            // --- การคำนวณแบบ Real-time (Derived State) ---
            const prof = gameState.profession;
            const hasProfession = prof !== null;

            const salary = prof ? prof.salary : 0;
            const p1PassiveIncome = gameState.assets.realEstate.reduce((sum, re) => sum + Number(re.cashflow), 0);
            const p1TotalIncome = salary + p1PassiveIncome;
            
            const taxes = prof ? prof.expenses.taxes : 0;
            const homeExp = (prof && gameState.liabilities.home > 0) ? prof.expenses.home : 0;
            const schoolExp = (prof && gameState.liabilities.school > 0) ? prof.expenses.school : 0;
            const carExp = (prof && gameState.liabilities.car > 0) ? prof.expenses.car : 0;
            const ccExp = (prof && gameState.liabilities.creditCard > 0) ? prof.expenses.creditCard : 0;
            const retailExp = prof ? prof.expenses.retail : 0; 
            const totalChildExp = gameState.children * (prof ? prof.expenses.perChild : 0);
            const bankLoanExp = (gameState.bankLoanAmount || 0) * 0.1; 

            const p1TotalExpenses = taxes + homeExp + schoolExp + carExp + ccExp + retailExp + totalChildExp + bankLoanExp;
            const p1MonthlyCashflow = p1TotalIncome - p1TotalExpenses;
            
            const isFastTrackReady = p1PassiveIncome >= p1TotalExpenses && p1TotalExpenses > 0 && !gameState.fastTrack.isActive;

            // กฎใหม่: ชนะเกมทันทีเมื่อธุรกิจใหม่ทำรายได้รวมเกิน 50,000
            const ftBusinessIncome = gameState.fastTrack.businesses.reduce((sum, b) => sum + Number(b.cashflow), 0);
            const ftTotalIncome = gameState.fastTrack.baseIncome + ftBusinessIncome; 
            const hasWonGame = gameState.fastTrack.isActive && (ftBusinessIncome >= 50000);

            // ==========================================
            // Event Handlers
            // ==========================================
            const handleSelectProfession = (profId) => {
                if(profId === '') return;
                const selected = PROFESSIONS.find(p => p.id === profId);
                setGameState(prev => ({
                    ...INITIAL_GAME_STATE, 
                    profession: selected,
                    cash: selected.savings, 
                    liabilities: { ...selected.liabilities }
                }));
                showToast(`เริ่มเกม: ${selected.name}`);
            };

            const handleRandomProfession = () => {
                const randomProf = PROFESSIONS[Math.floor(Math.random() * PROFESSIONS.length)];
                handleSelectProfession(randomProf.id);
            };

            const handlePayday = () => {
                if (!hasProfession) return;
                if (gameState.fastTrack.isActive) {
                    setGameState(prev => ({ ...prev, cash: prev.cash + ftTotalIncome }));
                    addHistory('CASHFLOW DAY', ftTotalIncome, 'income');
                    showToast(`CASHFLOW DAY! รับเงิน: ${formatMoney(ftTotalIncome)}`);
                } else {
                    if (p1MonthlyCashflow >= 0) {
                        setGameState(prev => ({ ...prev, cash: prev.cash + p1MonthlyCashflow }));
                        addHistory('รับ Payday', p1MonthlyCashflow, 'income');
                        showToast(`รับ Payday: ${formatMoney(p1MonthlyCashflow)}`);
                    } else {
                        const deficit = Math.abs(p1MonthlyCashflow);
                        if (gameState.cash >= deficit) {
                            setGameState(prev => ({ ...prev, cash: prev.cash - deficit }));
                            addHistory('จ่ายส่วนต่าง Payday ติดลบ', deficit, 'expense');
                            showToast(`จ่าย Payday ติดลบ: -${formatMoney(deficit)}`);
                        } else {
                            // เงินสดไม่พอจ่ายส่วนต่าง = เข้าสู่สถานะล้มละลายทันที
                            setBankruptcyMode(true);
                        }
                    }
                }
            };

            const handleBuyMLM = () => {
                if(gameState.mlmCount >= 2) return setConfirmDialog({ title: 'ผิดพลาด', message: 'ลงทุน MLM ได้สูงสุด 2 ธุรกิจเท่านั้น', onConfirm: null });
                executeWithAutoLoan(500, 'ลงทุนธุรกิจ MLM', (loanAmount) => {
                    setGameState(prev => ({
                        ...prev, cash: prev.cash + loanAmount - 500, bankLoanAmount: prev.bankLoanAmount + loanAmount, mlmCount: prev.mlmCount + 1
                    }));
                    if(loanAmount > 0) addHistory('กู้เงินธนาคาร', loanAmount, 'income');
                    addHistory('ลงทุนเปิดสายงาน MLM', 500, 'expense');
                    showToast("เริ่มทำธุรกิจ MLM แล้ว!");
                });
            };

            const handleCharity = () => {
                const amount = Math.floor(p1TotalIncome * 0.1);
                executeWithAutoLoan(amount, 'บริจาคเพื่อสังคม (10% รายรับรวม)', (loanAmount) => {
                    setGameState(prev => ({
                        ...prev, cash: prev.cash + loanAmount - amount, bankLoanAmount: prev.bankLoanAmount + loanAmount
                    }));
                    if(loanAmount > 0) addHistory('กู้เงินธนาคาร', loanAmount, 'income');
                    addHistory('บริจาค (10% รายรับรวม)', amount, 'expense');
                    showToast(`บริจาคสำเร็จ ${formatMoney(amount)}`);
                });
            };

            const handleFired = () => {
                const amount = Math.floor(p1TotalExpenses * 0.5);
                executeWithAutoLoan(amount, 'ค่าใช้จ่ายตกงาน (50% รายจ่ายรวม)', (loanAmount) => {
                    setGameState(prev => ({
                        ...prev, cash: prev.cash + loanAmount - amount, bankLoanAmount: prev.bankLoanAmount + loanAmount
                    }));
                    if(loanAmount > 0) addHistory('กู้เงินธนาคาร', loanAmount, 'income');
                    addHistory('ตกงาน (50% รายจ่าย)', amount, 'expense');
                    showToast(`เสียค่าตกงาน ${formatMoney(amount)}`);
                });
            };

            const updateChildren = (change) => {
                const newVal = gameState.children + change;
                if(newVal >= 0 && newVal <= 3) setGameState(prev => ({...prev, children: newVal}));
            };

            const executeManualTx = (e) => {
                e.preventDefault();
                const type = actionModal.payload;
                const amount = Number(manualTx.amount);
                const desc = manualTx.desc || 'รายการจิปาถะ';
                
                if (type === 'income') {
                    setGameState(prev => ({ ...prev, cash: prev.cash + amount }));
                    addHistory(desc, amount, 'income');
                    setActionModal(null);
                    showToast(`รับเงิน: ${formatMoney(amount)}`);
                } else {
                    executeWithAutoLoan(amount, desc, (loanAmount) => {
                        setGameState(prev => ({
                            ...prev, cash: prev.cash + loanAmount - amount, bankLoanAmount: prev.bankLoanAmount + loanAmount
                        }));
                        if(loanAmount > 0) addHistory('กู้เงินธนาคาร', loanAmount, 'income');
                        addHistory(desc, amount, 'expense');
                        setActionModal(null);
                        showToast(`จ่ายเงิน: ${formatMoney(amount)}`);
                    });
                }
            };

            const handleBankLoanAction = (actionType, overrideAmount = null) => {
                const amt = overrideAmount !== null ? overrideAmount : Number(customBankLoan);
                if (!amt || isNaN(amt) || amt <= 0 || amt % 1000 !== 0) {
                    return setConfirmDialog({ title: 'ข้อมูลไม่ถูกต้อง', message: 'กรุณาระบุจำนวนเงินกู้ให้เป็นจำนวนเท่าของ 1,000 (เช่น 1000, 2000, 5000)', onConfirm: null });
                }

                if (actionType === 'borrow') {
                    setGameState(p => ({...p, bankLoanAmount: p.bankLoanAmount + amt, cash: p.cash + amt}));
                    addHistory('กู้เงินธนาคาร', amt, 'income');
                    setCustomBankLoan('');
                    showToast(`กู้เงินสำเร็จ ${formatMoney(amt)}`);
                } else if (actionType === 'repay') {
                    if (gameState.bankLoanAmount < amt) return setConfirmDialog({ title: 'ยอดหนี้ไม่ถึง', message: 'คุณระบุยอดคืนมากกว่าหนี้ที่มีอยู่', onConfirm: null });
                    if (gameState.cash < amt) return setConfirmDialog({ title: 'เงินสดไม่พอ', message: 'คุณมีเงินสดไม่พอคืนธนาคาร', onConfirm: null });
                    
                    setGameState(p => ({...p, bankLoanAmount: p.bankLoanAmount - amt, cash: p.cash - amt}));
                    addHistory('คืนเงินธนาคาร', amt, 'expense');
                    setCustomBankLoan('');
                    showToast(`คืนเงินสำเร็จ ${formatMoney(amt)}`);
                }
            };

            const handlePayDebt = (debtType, currentDebt, label) => {
                if (bankruptcyMode) {
                    // หากอยู่ในโหมดล้มละลาย จะบังคับจ่ายจากเงินสดตรงๆ ห้ามกู้
                    setGameState(prev => ({
                        ...prev, cash: prev.cash - currentDebt, liabilities: { ...prev.liabilities, [debtType]: 0 }
                    }));
                    addHistory(`ปิดหนี้: ${label} (ล้มละลาย)`, currentDebt, 'expense');
                    return;
                }

                executeWithAutoLoan(currentDebt, `จ่ายปิดหนี้: ${label}`, (loanAmount) => {
                    setGameState(prev => ({
                        ...prev, cash: prev.cash + loanAmount - currentDebt, bankLoanAmount: prev.bankLoanAmount + loanAmount,
                        liabilities: { ...prev.liabilities, [debtType]: 0 }
                    }));
                    if(loanAmount > 0) addHistory('กู้เงินธนาคาร', loanAmount, 'income');
                    addHistory(`ปิดหนี้: ${label}`, currentDebt, 'expense');
                    showToast(`ปิดหนี้ ${label} สำเร็จ!`);
                });
            };

            // ---- Assets Management ----
            const addStock = (e) => {
                e.preventDefault();
                const shares = Number(stockInput.shares);
                const cost = Number(stockInput.costPerShare);
                const total = shares * cost;
                executeWithAutoLoan(total, `ซื้อสินทรัพย์ ${stockInput.symbol}`, (loanAmount) => {
                    setGameState(prev => {
                        let newStocks = [...prev.assets.stocks];
                        const existing = newStocks.find(s => s.symbol === stockInput.symbol);
                        if (existing) {
                            existing.shares += shares;
                            existing.totalCost += total;
                            existing.costPerShare = existing.totalCost / existing.shares;
                        } else {
                            newStocks.push({ id: generateId(), symbol: stockInput.symbol, shares, costPerShare: cost, totalCost: total });
                        }
                        return { ...prev, assets: { ...prev.assets, stocks: newStocks }, cash: prev.cash + loanAmount - total, bankLoanAmount: prev.bankLoanAmount + loanAmount };
                    });
                    if(loanAmount > 0) addHistory('กู้เงินธนาคาร', loanAmount, 'income');
                    addHistory(`ซื้อสินทรัพย์ ${stockInput.symbol}`, total, 'expense');
                    setStockInput({ symbol: PAPER_ASSETS[0], shares: '', costPerShare: '' });
                    showToast("ซื้อสินทรัพย์สำเร็จ");
                });
            };

            const addRealEstate = (e) => {
                e.preventDefault();
                const dp = Number(reInput.downPayment);
                const cost = Number(reInput.cost);
                const cf = Number(reInput.cashflow);
                executeWithAutoLoan(dp, `ดาวน์อสังหาฯ ${reInput.name}`, (loanAmount) => {
                    setGameState(prev => ({
                        ...prev,
                        assets: { ...prev.assets, realEstate: [...prev.assets.realEstate, { id: generateId(), name: reInput.name, downPayment: dp, cost, mortgage: cost - dp, cashflow: cf }] },
                        cash: prev.cash + loanAmount - dp,
                        bankLoanAmount: prev.bankLoanAmount + loanAmount
                    }));
                    if(loanAmount > 0) addHistory('กู้เงินธนาคาร', loanAmount, 'income');
                    addHistory(`ดาวน์อสังหาฯ ${reInput.name}`, dp, 'expense');
                    setReInput({ name: RE_ASSETS[0], downPayment: '', cost: '', cashflow: '' });
                    showToast("ซื้ออสังหาฯ สำเร็จ");
                });
            };

            const executeSellStock = (e) => {
                e.preventDefault();
                const { item } = actionModal.payload;
                const unitsToSell = Number(sellInput.units);
                const pricePerShare = parseSmartInput(sellInput.price, item.costPerShare);
                
                if (unitsToSell > item.shares) return setConfirmDialog({ title: 'ข้อมูลผิดพลาด', message: 'ระบุจำนวนขายเกินกว่าที่มีอยู่!', onConfirm: null });
                const totalReceive = unitsToSell * pricePerShare;

                setGameState(prev => {
                    let newStocks = [...prev.assets.stocks];
                    if (unitsToSell === item.shares) {
                        newStocks = newStocks.filter(s => s.id !== item.id);
                    } else {
                        const target = newStocks.find(s => s.id === item.id);
                        target.shares -= unitsToSell;
                        target.totalCost -= (unitsToSell * item.costPerShare);
                    }
                    addHistory(`ขาย ${item.symbol}`, totalReceive, 'income');
                    return { ...prev, assets: { ...prev.assets, stocks: newStocks }, cash: prev.cash + totalReceive };
                });
                setActionModal(null);
                showToast(`ขายสำเร็จ รับเงิน ${formatMoney(totalReceive)}`);
            };

            const executeSellRE = (e) => {
                e.preventDefault();
                const { item } = actionModal.payload;
                const sellPrice = parseSmartInput(sellInput.price, item.cost);
                const netProfit = sellPrice - item.mortgage;

                setGameState(prev => ({
                    ...prev,
                    assets: { ...prev.assets, realEstate: prev.assets.realEstate.filter(r => r.id !== item.id) },
                    cash: prev.cash + netProfit
                }));
                addHistory(`ขายอสังหาฯ ${item.name}`, netProfit, 'income');
                setActionModal(null);
                showToast(`ขายสำเร็จ กำไรสุทธิ ${formatMoney(netProfit)}`);
            };

            const handleSellToBankrupt = (re) => {
                const received = Math.floor(re.downPayment / 2); // ได้คืนแค่ครึ่งเดียวของเงินดาวน์
                setGameState(prev => ({
                    ...prev,
                    cash: prev.cash + received,
                    assets: { ...prev.assets, realEstate: prev.assets.realEstate.filter(r => r.id !== re.id) }
                }));
                addHistory(`ถูกยึดทรัพย์: ${re.name} (รับ 50% ดาวน์)`, received, 'income');
            };

            const handleEnterFastTrack = () => {
                const initialFTCash = p1PassiveIncome * 100;
                setGameState(prev => ({
                    ...prev,
                    cash: prev.cash + initialFTCash,
                    fastTrack: { isActive: true, baseIncome: 50000 + p1PassiveIncome, businesses: [] }
                }));
                addHistory(`เข้าสู่ลู่ทางด่วน (x100)`, initialFTCash, 'income');
                window.scrollTo(0,0);
            };

            // ==========================================
            // 3. UI Modals
            // ==========================================
            const renderBankruptcyModal = () => {
                if (!bankruptcyMode) return null;

                const isSaved = p1MonthlyCashflow >= 0;
                
                // ตรวจสอบว่ายังมีทางรอดไหม (ยังมีอสังหาให้ขาย หรือ มีเงินพอจ่ายหนี้อะไรได้บ้าง)
                const canDoSomething = gameState.assets.realEstate.length > 0 || 
                                       (gameState.bankLoanAmount > 0 && gameState.cash >= 1000) || 
                                       Object.values(gameState.liabilities).some(d => d > 0 && gameState.cash >= d);
                
                const isGameOver = !isSaved && !canDoSomething;

                if (isGameOver) {
                    return (
                        <div className="fixed inset-0 bg-slate-950/95 z-[90] flex items-center justify-center p-4 fade-in">
                            <div className="bg-white rounded-xl shadow-2xl max-w-sm w-full p-8 text-center border-t-8 border-slate-900">
                                <i className="fas fa-skull-crossbones text-6xl text-slate-800 mb-4"></i>
                                <h2 className="text-3xl font-black text-rose-700 mb-2">GAME OVER</h2>
                                <p className="text-slate-600 mb-6 text-sm">คุณล้มละลายโดยสมบูรณ์ ไม่เหลือทรัพย์สินให้ขาย และไม่มีเงินพอจะปลดหนี้ใดๆ ได้อีก ออกจากเกม!</p>
                                <button onClick={resetGame} className="w-full bg-slate-900 text-white font-bold py-3 rounded-lg shadow-lg hover:bg-slate-800 transition">เริ่มเกมใหม่</button>
                            </div>
                        </div>
                    );
                }

                return (
                    <div className="fixed inset-0 bg-rose-950/95 z-[90] flex items-start justify-center p-4 overflow-y-auto fade-in">
                        <div className="bg-white rounded-xl shadow-2xl max-w-lg w-full mt-10 overflow-hidden border-4 border-rose-600 mb-10">
                            <div className="bg-rose-600 text-white px-6 py-5 text-center">
                                <i className="fas fa-gavel text-3xl mb-2"></i>
                                <h3 className="text-2xl font-black">ศาลล้มละลาย (Bankruptcy)</h3>
                                <p className="text-rose-100 text-sm opacity-90 mt-1">กระแสเงินสดของคุณติดลบ และเงินสดไม่พอจ่ายส่วนต่าง!</p>
                            </div>
                            <div className="p-6">
                                <div className="flex gap-4 mb-6">
                                    <div className="flex-1 bg-slate-100 p-3 rounded-lg text-center border border-slate-200">
                                        <div className="text-xs text-slate-500 font-bold mb-1">เงินสดคงเหลือ</div>
                                        <div className="text-xl font-black text-slate-800">{formatMoney(gameState.cash)}</div>
                                    </div>
                                    <div className={`flex-1 p-3 rounded-lg text-center border ${isSaved ? 'bg-emerald-50 border-emerald-300' : 'bg-rose-50 border-rose-300'}`}>
                                        <div className="text-xs font-bold mb-1">กระแสเงินสดต่อเดือน</div>
                                        <div className={`text-2xl font-black ${isSaved ? 'text-emerald-600' : 'text-rose-600'}`}>{formatMoney(p1MonthlyCashflow)}</div>
                                        <div className="text-[10px] opacity-70 mt-1">(เป้าหมาย: เป็นบวก)</div>
                                    </div>
                                </div>

                                <div className="text-sm text-slate-600 mb-4 font-bold bg-amber-50 p-3 rounded border border-amber-200">
                                    <i className="fas fa-exclamation-circle text-amber-500 mr-1"></i> บังคับขายอสังหาฯ คืนธนาคาร (รับเงินสุทธิแค่ครึ่งเดียวของเงินดาวน์) นำเงินมาปลดหนี้เพื่อลดรายจ่ายให้กระแสเงินสดกลับมาเป็นบวก
                                </div>

                                {/* 1. ขายอสังหา */}
                                <div className="mb-6">
                                    <h4 className="font-bold text-rose-800 border-b border-rose-100 pb-1 mb-2">1. ขายคืนธนาคาร (รับเงินสด 50%)</h4>
                                    {gameState.assets.realEstate.length === 0 ? <div className="text-xs text-slate-400 italic text-center py-2">ไม่มีอสังหาฯ ให้ขายแล้ว</div> : (
                                        <ul className="space-y-2">
                                            {gameState.assets.realEstate.map(re => (
                                                <li key={re.id} className="bg-slate-50 p-3 rounded border border-slate-200 flex justify-between items-center">
                                                    <div>
                                                        <div className="font-bold text-sm text-slate-700">{re.name}</div>
                                                        <div className="text-[10px] text-slate-500">เงินดาวน์ ${re.downPayment} <i className="fas fa-arrow-right mx-1"></i> ขายทิ้งรับ <span className="text-emerald-600 font-bold">${Math.floor(re.downPayment/2)}</span></div>
                                                    </div>
                                                    <button onClick={() => handleSellToBankrupt(re)} className="bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold px-3 py-1.5 rounded shadow">ขายทิ้ง</button>
                                                </li>
                                            ))}
                                        </ul>
                                    )}
                                </div>

                                {/* 2. ปลดหนี้ */}
                                <div className="mb-6">
                                    <h4 className="font-bold text-emerald-800 border-b border-emerald-100 pb-1 mb-2">2. ปลดหนี้ (ใช้เงินสดที่มี)</h4>
                                    <ul className="space-y-2">
                                        {[
                                            { id: 'home', label: 'บ้าน', debt: gameState.liabilities.home },
                                            { id: 'school', label: 'กยศ.', debt: gameState.liabilities.school },
                                            { id: 'car', label: 'รถยนต์', debt: gameState.liabilities.car },
                                            { id: 'creditCard', label: 'บัตรเครดิต', debt: gameState.liabilities.creditCard },
                                        ].map(item => item.debt > 0 && (
                                            <li key={item.id} className="flex justify-between items-center bg-emerald-50 p-2 rounded border border-emerald-100">
                                                <div><div className="text-xs text-slate-500">หนี้{item.label}</div><div className="font-bold text-slate-800 text-sm">{formatMoney(item.debt)}</div></div>
                                                <button onClick={() => handlePayDebt(item.id, item.debt, item.label)} disabled={gameState.cash < item.debt} className={`text-xs px-3 py-1.5 rounded font-bold shadow-sm ${gameState.cash >= item.debt ? 'bg-white text-emerald-700 hover:bg-emerald-100 border border-emerald-300' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}>จ่ายโปะ</button>
                                            </li>
                                        ))}
                                        
                                        {/* เงินกู้ธนาคาร (คืนทีละ 1000) */}
                                        {gameState.bankLoanAmount > 0 && (
                                            <li className="flex justify-between items-center bg-blue-50 p-2 rounded border border-blue-100 mt-2">
                                                <div><div className="text-xs text-slate-500">หนี้ธนาคาร</div><div className="font-bold text-slate-800 text-sm">{formatMoney(gameState.bankLoanAmount)}</div></div>
                                                <button onClick={() => handleBankLoanAction('repay', 1000)} disabled={gameState.cash < 1000} className={`text-xs px-3 py-1.5 rounded font-bold shadow-sm ${gameState.cash >= 1000 ? 'bg-white text-blue-700 hover:bg-blue-100 border border-blue-300' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}>คืน $1,000</button>
                                            </li>
                                        )}
                                    </ul>
                                </div>

                                <button onClick={() => setBankruptcyMode(false)} disabled={!isSaved} className={`w-full py-4 rounded-xl font-black text-lg transition shadow-lg ${isSaved ? 'bg-emerald-500 hover:bg-emerald-600 text-white' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}>
                                    {isSaved ? '🎉 รอดพ้นวิกฤต! กลับสู่เกม' : '🔒 ต้องทำกระแสเงินสดให้เป็นบวก'}
                                </button>
                            </div>
                        </div>
                    </div>
                );
            };

            const renderActionModal = () => {
                if (!actionModal) return null;
                const { type, payload } = actionModal;

                return (
                    <div className="fixed inset-0 bg-slate-900/80 z-[70] flex items-center justify-center p-4 fade-in">
                        <div className="bg-white rounded-xl shadow-2xl max-w-md w-full overflow-hidden border-2 border-slate-200">
                            <div className="bg-slate-800 text-white px-6 py-4 flex justify-between items-center">
                                <h3 className="text-lg font-bold">
                                    {type === 'one_off_tx' && (payload === 'income' ? '💰 บันทึกรายรับ (จิปาถะ)' : '💳 บันทึกรายจ่าย (จิปาถะ)')}
                                    {type === 'sell_stock' && `📈 ขายสินทรัพย์: ${payload.item.symbol}`}
                                    {type === 'sell_re' && `🏠 ขายอสังหาฯ: ${payload.item.name}`}
                                    {type === 'buy_ft_business' && `💼 ซื้อธุรกิจบนลู่ทางด่วน`}
                                </h3>
                                <button type="button" onClick={() => setActionModal(null)} className="text-slate-300 hover:text-white"><i className="fas fa-times"></i></button>
                            </div>
                            <div className="p-6">
                                
                                {type === 'one_off_tx' && (
                                    <form onSubmit={executeManualTx}>
                                        <div className="mb-4">
                                            <label className="block text-sm font-bold text-slate-700 mb-1">คำอธิบายรายการ</label>
                                            <datalist id="expense-presets">
                                                <option value="ค่าฟุ่มเฟือย (Doodads)" />
                                                <option value="ค่าสัญญาผู้เล่นอื่น" />
                                                <option value="ค่าทำแอคชั่น" />
                                                <option value="ค่าซ่อมแซม" />
                                            </datalist>
                                            <input type="text" list={payload === 'expense' ? 'expense-presets' : ''} value={manualTx.desc} onChange={e => setManualTx({...manualTx, desc: e.target.value})} placeholder={payload === 'income' ? 'เช่น ได้เงินจากผู้เล่นอื่น' : 'ระบุรายการ หรือเลือกจากตัวเลือก'} className="w-full border rounded p-3 bg-slate-50 outline-none focus:border-blue-500" required />
                                        </div>
                                        <div className="mb-6">
                                            <label className="block text-sm font-bold text-slate-700 mb-1">จำนวนเงิน</label>
                                            <NumberInput value={manualTx.amount} onChange={val => setManualTx({...manualTx, amount: val})} className="w-full border rounded p-3 text-xl font-bold bg-slate-50 outline-none focus:border-blue-500" required />
                                        </div>
                                        <button type="submit" className={`w-full text-white font-bold py-3 rounded-lg shadow-md transition ${payload === 'income' ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-red-600 hover:bg-red-700'}`}>
                                            ยืนยัน{payload === 'income' ? 'รับเงิน' : 'จ่ายเงิน'}
                                        </button>
                                    </form>
                                )}

                                {type === 'buy_ft_business' && (
                                    <form onSubmit={(e) => {
                                        e.preventDefault();
                                        const cost = Number(manualTx.amount);
                                        const cf = Number(manualTx.cashflow);
                                        if (gameState.cash < cost) {
                                            return setConfirmDialog({ title: 'เงินสดไม่พอ', message: 'คุณมีเงินสดไม่พอที่จะซื้อธุรกิจนี้!', onConfirm: () => setConfirmDialog(null) });
                                        }
                                        setGameState(prev => ({
                                            ...prev, cash: prev.cash - cost,
                                            fastTrack: { ...prev.fastTrack, businesses: [...prev.fastTrack.businesses, { id: generateId(), name: manualTx.desc, cost, cashflow: cf }] }
                                        }));
                                        addHistory(`ซื้อธุรกิจ FT: ${manualTx.desc}`, cost, 'expense');
                                        setActionModal(null);
                                        showToast("ซื้อธุรกิจใหม่สำเร็จ!");
                                    }}>
                                        <div className="mb-4">
                                            <label className="block text-sm font-bold text-slate-700 mb-1">ชื่อธุรกิจ</label>
                                            <input type="text" value={manualTx.desc} onChange={e => setManualTx({...manualTx, desc: e.target.value})} className="w-full border rounded p-3 bg-slate-50 outline-none focus:border-blue-500" required />
                                        </div>
                                        <div className="mb-4">
                                            <label className="block text-sm font-bold text-slate-700 mb-1">ราคาซื้อ (จ่ายเงินสดก้อนเดียว)</label>
                                            <NumberInput value={manualTx.amount} onChange={val => setManualTx({...manualTx, amount: val})} className="w-full border rounded p-3 text-xl font-bold bg-slate-50 outline-none focus:border-blue-500" required />
                                        </div>
                                        <div className="mb-6">
                                            <label className="block text-sm font-bold text-slate-700 mb-1">Cashflow ที่ได้ต่อเดือน</label>
                                            <NumberInput value={manualTx.cashflow} onChange={val => setManualTx({...manualTx, cashflow: val})} className="w-full border rounded p-3 text-xl font-bold bg-emerald-50 text-emerald-700 outline-none focus:border-emerald-500" required />
                                        </div>
                                        <button type="submit" className="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 rounded shadow">ยืนยันการซื้อธุรกิจ</button>
                                    </form>
                                )}

                                {type === 'sell_stock' && (() => {
                                    const { item } = payload;
                                    const sellPrc = parseSmartInput(sellInput.price, item.costPerShare);
                                    const units = Number(sellInput.units);
                                    const totalRecv = (!isNaN(sellPrc) && units > 0) ? sellPrc * units : 0;
                                    const profit = totalRecv - (item.costPerShare * units);

                                    return (
                                        <form onSubmit={executeSellStock}>
                                            <div className="flex justify-between text-sm mb-4 bg-slate-50 p-3 rounded border">
                                                <div><div className="text-slate-500">จำนวนที่มี</div><div className="font-bold">{item.shares} หน่วย</div></div>
                                                <div className="text-right"><div className="text-slate-500">ต้นทุนเฉลี่ย</div><div className="font-bold text-blue-600">{formatMoney(item.costPerShare)}</div></div>
                                            </div>
                                            <div className="grid grid-cols-2 gap-4 mb-4">
                                                <div>
                                                    <div className="flex justify-between items-center mb-1">
                                                        <label className="text-xs font-bold text-slate-700">จำนวนที่ขาย</label>
                                                        <button type="button" onClick={() => setSellInput({...sellInput, units: item.shares})} className="text-[10px] bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded font-bold hover:bg-blue-200">ขายทั้งหมด</button>
                                                    </div>
                                                    <NumberInput value={sellInput.units} onChange={val => setSellInput({...sellInput, units: val})} className="w-full border rounded p-2 outline-none focus:border-blue-500" required />
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-bold text-slate-700 mb-1">ราคาขาย / หน่วย</label>
                                                    <input type="text" value={sellInput.price} onChange={e => setSellInput({...sellInput, price: e.target.value})} placeholder="เช่น 50, +20%, +10" className="w-full border rounded p-2 outline-none focus:border-blue-500" required />
                                                </div>
                                            </div>
                                            
                                            {totalRecv > 0 && (
                                                <div className={`mb-6 p-4 rounded-lg border text-center ${profit >= 0 ? 'bg-emerald-50 border-emerald-200' : 'bg-red-50 border-red-200'}`}>
                                                    <div className="text-sm text-slate-600 mb-1">รวมรับเงินสุทธิ</div>
                                                    <div className={`text-3xl font-black ${profit >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>{formatMoney(totalRecv)}</div>
                                                    <div className="text-xs mt-1 font-bold">({profit >= 0 ? '+' : ''}{formatMoney(profit)} จากต้นทุน)</div>
                                                </div>
                                            )}
                                            <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded shadow">ยืนยันการขาย</button>
                                        </form>
                                    );
                                })()}

                                {type === 'sell_re' && (() => {
                                    const { item } = payload;
                                    const sellPrc = parseSmartInput(sellInput.price, item.cost);
                                    const netProfit = (!isNaN(sellPrc)) ? sellPrc - item.mortgage : 0;

                                    return (
                                        <form onSubmit={executeSellRE}>
                                            <div className="flex justify-between text-sm mb-4 bg-slate-50 p-3 rounded border">
                                                <div><div className="text-slate-500">ต้นทุนซื้อมา</div><div className="font-bold">{formatMoney(item.cost)}</div></div>
                                                <div className="text-right"><div className="text-slate-500">จำนองที่ต้องหักคืน</div><div className="font-bold text-orange-600">{formatMoney(item.mortgage)}</div></div>
                                            </div>
                                            <div className="mb-4">
                                                <label className="block text-sm font-bold text-slate-700 mb-1">ราคาขายรวม (Total Price)</label>
                                                <input type="text" value={sellInput.price} onChange={e => setSellInput({...sellInput, price: e.target.value})} placeholder="เช่น 50000, +20% หรือราคาเต็ม" className="w-full border rounded p-3 outline-none focus:border-blue-500" required />
                                            </div>

                                            {!isNaN(sellPrc) && sellPrc > 0 && (
                                                <div className={`mb-6 p-4 rounded-lg border text-center ${netProfit >= 0 ? 'bg-emerald-50 border-emerald-200' : 'bg-red-50 border-red-200'}`}>
                                                    <div className="text-sm text-slate-600 mb-1">กำไรสุทธิ (หักจำนองแล้ว)</div>
                                                    <div className={`text-3xl font-black ${netProfit >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>{formatMoney(netProfit)}</div>
                                                    {netProfit < 0 && <div className="text-xs mt-1 text-red-600 font-bold">⚠️ ขาดทุน! หักจำนองแล้วเงินไม่พอคืน</div>}
                                                </div>
                                            )}
                                            <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded shadow">ยืนยันการขาย</button>
                                        </form>
                                    );
                                })()}
                            </div>
                        </div>
                    </div>
                );
            };

            // ==========================================
            // 4. UI Render 
            // ==========================================
            return (
                <div className="min-h-screen pb-20 text-slate-800">
                    
                    {toastMsg && (
                        <div className="fixed top-4 right-4 bg-slate-800 text-white px-4 py-3 rounded-lg shadow-xl z-[120] flex items-center gap-2 fade-in border-l-4 border-emerald-500">
                            <i className="fas fa-check-circle text-emerald-400"></i> {toastMsg}
                        </div>
                    )}

                    {/* แก้บั๊ก Z-index และปุ่มกดยืนยันของ Confirm Dialog */}
                    {confirmDialog && (
                        <div className="fixed inset-0 bg-slate-900/80 z-[130] flex items-center justify-center p-4 fade-in">
                            <div className="bg-white rounded-xl shadow-xl max-w-sm w-full p-6 text-center border-2 border-slate-200">
                                <h3 className="text-xl font-bold mb-2">{confirmDialog.title}</h3>
                                <p className="text-slate-600 mb-6">{confirmDialog.message}</p>
                                <div className="flex justify-center gap-3">
                                    <button onClick={() => setConfirmDialog(null)} className="flex-1 py-3 bg-slate-100 hover:bg-slate-200 font-bold rounded-lg transition text-slate-700">ปิด / ยกเลิก</button>
                                    {confirmDialog.onConfirm && (
                                        <button onClick={confirmDialog.onConfirm} className="flex-1 py-3 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-lg shadow transition">ยืนยัน</button>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                                            <div className="bg-slate-50 p-4 rounded-lg border border-slate-200">
                                                <div className="flex justify-between items-center mb-3">
                                                    <div className="font-bold text-slate-700 text-sm">เงินกู้ยืมธนาคาร (ดอกเบี้ย 10%)</div>
                                                    <div className="font-black text-rose-600 text-xl">{formatMoney(gameState.bankLoanAmount)}</div>
                                                </div>
                                                <div className="flex gap-2">
                                                    <NumberInput value={customBankLoan} onChange={val => setCustomBankLoan(val)} placeholder="ระบุยอด x1,000" className="flex-1 border rounded px-2 py-1.5 text-sm outline-none focus:border-blue-500" />
                                                    <button onClick={() => handleBankLoanAction('borrow')} className="bg-white border border-slate-300 rounded px-4 py-1.5 text-sm font-bold shadow-sm hover:bg-slate-100">+ กู้</button>
                                                    <button onClick={() => handleBankLoanAction('repay')} className="bg-white border border-rose-300 rounded px-4 py-1.5 text-sm font-bold shadow-sm hover:bg-rose-50 text-rose-600">- คืน</button>
                                                </div>
                                                <div className="text-[10px] text-slate-400 mt-1">* ต้องระบุเป็นจำนวนทวีคูณของ 1,000 เสมอ</div>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                                        <div className="bg-slate-100 px-4 py-2 border-b font-bold text-slate-600 text-sm flex justify-between">
                                            <span><i className="fas fa-list-ul"></i> ประวัติรายการย้อนหลัง (History)</span>
                                        </div>
                                        <div className="p-0">
                                            {gameState.history.length === 0 ? <div className="p-6 text-center text-slate-400 text-sm italic">ยังไม่มีประวัติการทำรายการ</div> : (
                                                <ul className="max-h-60 overflow-y-auto custom-scrollbar divide-y divide-slate-100">
                                                    {gameState.history.map((log, idx) => (
                                                        <li key={log.id} className={`p-3 text-sm flex justify-between items-center ${idx === 0 ? 'bg-blue-50/50' : 'hover:bg-slate-50'}`}>
                                                            <div>
                                                                <div className="font-bold text-slate-700">{log.desc}</div>
                                                                <div className="text-[10px] text-slate-400">{log.time}</div>
                                                            </div>
                                                            <div className={`font-black ${log.type === 'income' ? 'text-emerald-600' : log.type === 'expense' ? 'text-rose-600' : 'text-slate-500'}`}>
                                                                {log.type === 'income' ? '+' : log.type === 'expense' ? '-' : ''}{formatMoney(log.amount)}
                                                            </div>
                                                        </li>
                                                    ))}
                                                </ul>
                                            )}
                                        </div>
                                    </div>

                                </div>
                            </div>
                        )}

                        {gameState.fastTrack.isActive && !hasWonGame && (
                            <div className="grid lg:grid-cols-2 gap-6 fade-in">
                                <div className="space-y-6">
                                    <div className="bg-white rounded-xl shadow-sm border-2 border-purple-200 overflow-hidden">
                                        <div className="bg-purple-100 px-4 py-3 font-black text-purple-900 border-b border-purple-200 text-lg"><i className="fas fa-chart-line"></i> รายรับบนลู่ทางด่วน</div>
                                        <div className="p-6">
                                            <div className="flex justify-between items-center bg-slate-50 p-4 rounded-lg border mb-4">
                                                <span className="font-bold text-slate-600">กระแสเงินสดพื้นฐาน</span>
                                                <span className="text-2xl font-black text-slate-800">{formatMoney(gameState.fastTrack.baseIncome)}</span>
                                            </div>
                                            <div className="flex justify-between items-center bg-emerald-50 p-4 rounded-lg border border-emerald-200">
                                                <div>
                                                    <span className="font-bold text-emerald-800 block">รายได้ธุรกิจใหม่ (เป้า: $50K)</span>
                                                </div>
                                                <span className="text-3xl font-black text-emerald-600">+{formatMoney(ftBusinessIncome)}</span>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="bg-white rounded-xl shadow-sm border-2 border-rose-200 overflow-hidden p-6 text-center">
                                        <h3 className="font-bold text-slate-700 mb-2">บทลงโทษ (Lawsuit / Divorce)</h3>
                                        <p className="text-xs text-slate-500 mb-4">เสียเงินสดที่มีอยู่ "ครึ่งหนึ่ง" ทันที</p>
                                        <button onClick={() => {
                                            const penalty = Math.floor(gameState.cash / 2);
                                            setGameState(prev => ({...prev, cash: prev.cash - penalty}));
                                            addHistory('โดนค่าปรับทางด่วน (-50%)', penalty, 'expense');
                                        }} className="bg-rose-100 hover:bg-rose-200 text-rose-700 font-bold py-2 px-6 rounded-full border border-rose-300 transition-colors">
                                            หักเงินสดครึ่งหนึ่ง!
                                        </button>
                                    </div>
                                </div>

                                <div className="space-y-6">
                                    <div className="bg-white rounded-xl shadow-sm border-2 border-amber-200 overflow-hidden">
                                        <div className="bg-amber-100 px-4 py-3 font-black text-amber-900 border-b border-amber-200 text-lg">ธุรกิจ (Businesses)</div>
                                        <div className="p-4">
                                            {gameState.fastTrack.businesses.length === 0 ? <div className="text-center py-8 text-slate-400">ยังไม่ได้ซื้อธุรกิจใดๆ</div> : 
                                                <ul className="space-y-3">
                                                    {gameState.fastTrack.businesses.map(b => (
                                                        <li key={b.id} className="bg-slate-50 border p-4 rounded-lg flex justify-between items-center">
                                                            <div><div className="font-bold">{b.name}</div><div className="text-xs text-slate-500">ซื้อมา: {formatMoney(b.cost)}</div></div>
                                                            <div className="font-black text-emerald-600 text-lg">+{formatMoney(b.cashflow)}</div>
                                                        </li>
                                                    ))}
                                                </ul>
                                            }
                                            {/* เปลี่ยนปุ่มซื้อธุรกิจให้ดึง Action Modal ขึ้นมาแทนการใช้ prompt */}
                                            <button onClick={() => openModal({type: 'buy_ft_business'})} className="w-full mt-4 bg-amber-500 text-white font-bold py-3 rounded-lg shadow hover:bg-amber-600 transition">+ ซื้อธุรกิจใหม่</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                        
                        {hasProfession && gameState.fastTrack.isActive && !hasWonGame && (
                            <div className="mt-8 bg-slate-800 text-white p-4 rounded-xl text-center font-bold">
                                <i className="fas fa-lock text-amber-400 mr-2"></i> ข้อมูลสนามแข่งหนูถูกแช่แข็งแล้ว (คุณอยู่บนลู่ทางด่วน)
                            </div>
                        )}

                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
